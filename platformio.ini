; PlatformIO project configuration for Keep-Talking-Project
;
; Open the repository in VS Code with the PlatformIO extension installed.
; Each Arduino module is exposed as a separate environment so the existing
; .ino files can stay where they are.
;
; Elegoo/Arduino Nano note:
; - nanoatmega328 = classic/old Nano bootloader
; - nanoatmega328new = newer Nano bootloader
; Change `board` below if uploads fail because of bootloader mismatch.

[platformio]
src_dir = arduino

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600

[env:kt_button]
build_src_filter =
    +<KT_Module_Button/KT_Module_Button.ino>
lib_deps =
    adafruit/Adafruit NeoPixel

[env:kt_countdown]
build_src_filter =
    +<KT_Module_Countdown/KT_Module_Countdown.ino>
lib_deps =
    avishorp/TM1637

[env:kt_edgework]
build_src_filter =
    +<KT_Module_Edgework/KT_Module_Edgework.ino>

[env:kt_fils]
build_src_filter =
    +<KT_Module_Fils/KT_Module_Fils.ino>

[env:kt_keyboard]
build_src_filter =
    +<KT_Module_Keyboard/KT_Module_Keyboard.ino>
; This module includes <light_CD74HC4067.h>.
; Keep using the same Arduino library by placing it under lib/
; if PlatformIO cannot auto-detect it from your global libraries.

[env:kt_maze]
build_src_filter =
    +<KT_Module_Maze/KT_Module_Maze.ino>
lib_deps =
    adafruit/Adafruit NeoPixel

[env:kt_password]
build_src_filter =
    +<KT_Module_Password/KT_Module_Password.ino>
lib_deps =
    johnrickman/LiquidCrystal_I2C

[env:kt_simonsay]
build_src_filter =
    +<KT_Module_SimonSay/KT_Module_SimonSay.ino>
